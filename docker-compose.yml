services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-km}
      POSTGRES_USER: ${POSTGRES_USER:-km}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-km_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - km_pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-km} -d ${POSTGRES_DB:-km}"]
      interval: 5s
      retries: 10

volumes:
  km_pgdata:
